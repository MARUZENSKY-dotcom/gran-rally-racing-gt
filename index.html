<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAN RALLY RACING</title></head>
<body style="margin:0;background:#000;color:#fff;font:600 16px Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="l">LOADING… <span id="p"></span></div>
<script>
(async()=>{const n=3,l=document.getElementById('l');try{let t='';for(let i=1;i<=n;i++){const r=await fetch('parts/part'+i+'.txt');if(!r.ok)throw new Error(r.status);t+=await r.text();document.getElementById('p').textContent=i+'/'+n}
document.open();document.write(t);document.close()}catch(e){l.textContent='Failed to load the game files. Refresh the page.'}})();
</script></body></html>
